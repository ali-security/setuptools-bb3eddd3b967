name: tests

on:
  # Fork: merge_group/push/pull_request triggers removed; manual dispatch only.
  workflow_dispatch:
    inputs:
      # Fork: allow dispatching a subset of tests (empty = full suite).
      test-filter:
        description: 'Optional pytest selector to run a subset of tests'
        required: false
        default: ''

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Environment variable to support color support (jaraco/skeleton#66)
  FORCE_COLOR: 1

  # Suppress noisy pip warnings
  PIP_DISABLE_PIP_VERSION_CHECK: 'true'
  PIP_NO_WARN_SCRIPT_LOCATION: 'true'

  # Ensure tests can sense settings about the environment
  TOX_OVERRIDE: >-
    testenv.pass_env+=GITHUB_*,FORCE_COLOR


jobs:
  test:
    strategy:
      # Fork: don't let one red leg cancel the others.
      fail-fast: false
      # https://blog.jaraco.com/efficient-use-of-ci-resources/
      matrix:
        python:
        - "3.9"
        - "3.13"
        platform:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        include:
        - python: "3.10"
          platform: ubuntu-latest
        - python: "3.11"
          platform: ubuntu-latest
        - python: "3.12"
          platform: ubuntu-latest
        - python: "3.14"
          platform: ubuntu-latest
        - python: pypy3.10
          platform: ubuntu-latest
          distutils: stdlib
        - platform: ubuntu-latest
          python: "3.10"
          distutils: stdlib
    runs-on: ${{ matrix.platform }}
    # Fork: upstream `continue-on-error` (3.14/pypy) removed so failures are not
    # masked; pypy flakes (#6345) are handled with `--reruns 2` on the Run step.
    # XXX: pypy seems to be flaky with unrelated tests in #6345
    env:
      SETUPTOOLS_USE_DISTUTILS: ${{ matrix.distutils || 'local' }}
      # Fork: deprecation due dates have passed; don't turn warnings into errors.
      SETUPTOOLS_ENFORCE_DEPRECATION: '0'
      # Fork: release-era PyPI snapshot (3.14 needs a later date for pymongo cp314 wheels).
      SEAL_INDEX_URL: https://:${{ matrix.python == '3.14' && '2025-10-15' || '2025-04-24' }}@time-machines-pypi.sealsecurity.io/
      # Fork: tox splits TOX_OVERRIDE entries on ';' (no surrounding whitespace).
      # Drop the lint/type `check`/`type` extras, pin wheel<0.46 (0.46.x yanked),
      # add pytest-rerunfailures, and install from the time machine.
      TOX_OVERRIDE: "testenv.pass_env+=GITHUB_*,FORCE_COLOR;\
        testenv.extras=test,cover,enabler,core;\
        testenv.deps+=wheel<0.46;\
        testenv.deps+=pytest-rerunfailures;\
        testenv.install_command=python -I -m pip install --index-url https://:${{ matrix.python == '3.14' && '2025-10-15' || '2025-04-24' }}@time-machines-pypi.sealsecurity.io/ {opts} {packages}"
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        # Install dependencies for building packages on pre-release Pythons
        # jaraco/skeleton#161
        if: matrix.python == '3.14' && matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libxml2-dev libxslt-dev
      - name: Setup Python
        id: python-install
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
        env:
          # Workaround for actions/setup-python#981 (env var only modified for this specific step)
          # Fork: Windows 3.9 needs the same stdlib workaround as macOS 3.9.
          SETUPTOOLS_USE_DISTUTILS: ${{ (matrix.platform == 'macos-latest' || matrix.platform == 'windows-latest') && matrix.python == '3.9' && 'stdlib' || matrix.distutils || 'local' }}
      - uses: actions/cache@v4
        id: cache
        with:
          path: setuptools/tests/config/downloads/*.cfg
          key: >-
            ${{ hashFiles('setuptools/tests/config/setupcfg_examples.txt') }}-
            ${{ hashFiles('setuptools/tests/config/downloads/*.py') }}
      - name: Populate download cache
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: setuptools/tests/config
        run: python -m downloads.preload setupcfg_examples.txt
      # Fork: "Adjust env vars" (PIPX_DEFAULT_PYTHON) step dropped; pipx no longer used.
      - name: Pre-build distributions for test
        shell: bash
        run: |
          rm -rf dist
          # workaround for pypa/setuptools#4333
          # Fork: today's pipx needs pip>=26.1 (no py3.9, Homebrew py3.15 on macOS);
          # build with the job's Python from the time machine instead.
          python -m pip install --index-url '${{ env.SEAL_INDEX_URL }}' build 'pyproject-hooks!=1.1'
          python -m build
          echo "PRE_BUILT_SETUPTOOLS_SDIST=$(ls dist/*.tar.gz)" >> $GITHUB_ENV
          echo "PRE_BUILT_SETUPTOOLS_WHEEL=$(ls dist/*.whl)" >> $GITHUB_ENV
          rm -rf setuptools.egg-info  # Avoid interfering with the other tests
      - name: Workaround for unreleased PyNaCl (pyca/pynacl#805)
        if: contains(matrix.python, 'pypy')
        run: echo "SETUPTOOLS_ENFORCE_DEPRECATION=0" >> $GITHUB_ENV
      - name: Install tox
        # Fork: time-machine tox so the venv gets release-era pip
        # (pip>=25.3 breaks the easy_install/namespaces tests).
        run: python -m pip install --index-url '${{ env.SEAL_INDEX_URL }}' tox
      - name: Run
        # Fork: skip exercises.py (pytest-perf breaks with the fork dir name),
        # rerun pypy flakes (#6345), and pass the optional dispatch test filter.
        # --color=no keeps the pytest summary line ("N passed") free of ANSI codes.
        run: tox -- --color=no --ignore=exercises.py ${{ contains(matrix.python, 'pypy') && '--reruns 2' || '' }} ${{ inputs.test-filter }}
      # Fork: coverage report/publish steps removed (codecov needs a secret).

  # Fork: replays `tox -e release` minus the upload, producing the dist artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fork: deprecation due dates have passed; don't turn warnings into errors.
      SETUPTOOLS_ENFORCE_DEPRECATION: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          # setuptools==79.0.0 provides the `saveopts` command via installed entry points
          python -m pip install --index-url 'https://:2025-04-24@time-machines-pypi.sealsecurity.io/' build 'pyproject-hooks!=1.1' 'setuptools==79.0.0'
          python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
          # unset tag_build and tag_date pypa/setuptools#2500
          python setup.py egg_info -Db "" saveopts
          python -m build
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  collateral:
    # Fork: disabled — diffcov is a coverage gate and docs is a doc build, not tests.
    if: false
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job:
        - diffcov
        - docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install tox
        run: python -m pip install tox
      - name: Eval ${{ matrix.job }}
        run: tox -e ${{ matrix.job }}

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    # Fork: `collateral` removed from needs (job disabled).
    needs:
    - integration-test
    - test
    - test_cygwin

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        allowed-skips: integration-test
        jobs: ${{ toJSON(needs) }}

  test_cygwin:
    strategy:
      matrix:
        python:
        - 39
        platform:
        - windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    env:
      # Fork: deprecation due dates have passed; don't turn warnings into errors.
      SETUPTOOLS_ENFORCE_DEPRECATION: '0'
      # Fork: same overrides as `test` (';'-separated); jaraco.packaging is
      # needed once the `check` extra is dropped.
      TOX_OVERRIDE: "testenv.pass_env+=GITHUB_*,FORCE_COLOR;\
        testenv.extras=test,cover,enabler,core;\
        testenv.deps+=wheel<0.46;\
        testenv.deps+=jaraco.packaging;\
        testenv.install_command=python -I -m pip install --index-url https://:2025-04-24@time-machines-pypi.sealsecurity.io/ {opts} {packages}"
    steps:
      - uses: actions/checkout@v4
      - name: Install Cygwin with Python
        uses: cygwin/cygwin-install-action@v4
        with:
          platform: x86_64
          packages: >-
            python${{ matrix.python }},
            python${{ matrix.python }}-devel,
            python${{ matrix.python }}-pip,
            gcc-core,
            git,
      - name: Record the currently selected Python version
        id: python-install
        # NOTE: This roughly emulates what `actions/setup-python` provides
        # NOTE: except the action gets the version from the installation path
        # NOTE: on disk and we get it from runtime.
        run: |
          python -c 'import platform; print("python-version=" + platform.python_version())' >> ${GITHUB_OUTPUT}
        shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
      - name: Install tox using pip
        shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
        run: |
          # Workaround for https://github.com/pypa/setuptools/issues/4831
          # Fork: time-machine tox so the venv gets release-era pip.
          python -m pip install --index-url 'https://:2025-04-24@time-machines-pypi.sealsecurity.io/' tox
      - name: Run tests
        shell: C:\cygwin\bin\env.exe CYGWIN_NOWINPATH=1 CHERE_INVOKING=1 C:\cygwin\bin\bash.exe -leo pipefail -o igncr {0}
        run: |
          git config --global --add safe.directory "$(cygpath -u "${{ github.workspace }}")" # workaround for #3408
          echo "$(cygpath -u "${{ github.workspace }}")" # for debugging purposes
          # Fork: skip exercises.py (pytest-perf) and pass the optional dispatch test filter.
          # --color=no keeps the pytest summary line ("N passed") free of ANSI codes.
          python -m tox -- --color=no --ignore=exercises.py ${{ inputs.test-filter }}
      # Fork: coverage report/publish steps removed (codecov needs a secret).

  integration-test:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.ref, 'refs/tags/'))
    # To avoid long times and high resource usage, we assume that:
    # 1. The setuptools APIs used by packages don't vary too much with OS or
    #    Python implementation
    # 2. Any circumstance for which the previous assumption is not valid is
    #    already tested via unit tests (or other tests not classified here as
    #    "integration")
    # With that in mind, the integration tests can run for a single setup
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Fork: deprecation due dates have passed; don't turn warnings into errors.
      SETUPTOOLS_ENFORCE_DEPRECATION: '0'
      # Fork: same overrides as `test` (';'-separated), time machine for installs.
      TOX_OVERRIDE: "testenv.pass_env+=GITHUB_*,FORCE_COLOR;\
        testenv.extras=test,cover,enabler,core;\
        testenv.deps+=wheel<0.46;\
        testenv.install_command=python -I -m pip install --index-url https://:2025-04-24@time-machines-pypi.sealsecurity.io/ {opts} {packages}"
    steps:
      - uses: actions/checkout@v4
      - name: Install OS-level dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential gfortran libopenblas-dev libyaml-dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Use a release that is not very new but still have a long life:
          python-version: "3.10"
      - name: Install tox
        # Fork: time-machine tox so the venv gets release-era pip.
        run: |
          python -m pip install --index-url 'https://:2025-04-24@time-machines-pypi.sealsecurity.io/' tox
      - name: Run integration tests
        # Fork: --color=no keeps the pytest summary line free of ANSI codes
        # (tox.ini's default posargs `-vv --durations=10` kept verbatim).
        run: tox -e integration -- --color=no -vv --durations=10

  release:
    permissions:
      contents: write
    needs:
    - check
    # Fork: disabled — publishing needs secrets.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install tox
        run: python -m pip install tox
      - name: Run
        run: tox -e release
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
